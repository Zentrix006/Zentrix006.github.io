<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victim Site — Secure Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.login-card {
    background: #fff;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-card h1 {
    font-size: 1.5rem;
    color: #333;
    margin-bottom: 8px;
}
.login-card p {
    color: #666;
    font-size: 0.9rem;
    margin-bottom: 24px;
}
label {
    display: block;
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
}
input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 16px;
    transition: border-color 0.2s;
}
input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
}
button {
    width: 100%;
    padding: 14px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
}
button:hover { background: #5a6fd6; }
.footer-note {
    margin-top: 20px;
    font-size: 0.75rem;
    color: #999;
    text-align: center;
}
</style>
</head>
<body>
<div class="login-card">
    <h1>SecureBank Login</h1>
    <p>Sign in to your account</p>
    <form autocomplete="on">
        <label for="user">Username</label>
        <input id="user" name="username" type="text" autocomplete="username" placeholder="Enter username">
        <label for="pass">Password</label>
        <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="Enter password">
        <button type="submit">Sign In</button>
    </form>
    <div class="footer-note">Mock victim page for autofill clickjacking demo</div>
</div>
</body>
</html>
