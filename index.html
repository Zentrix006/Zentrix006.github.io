<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ZENTRIX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#02040f;
    overflow:hidden;
    font-family:'Orbitron',sans-serif;
    color:white;
}

/* MATRIX CANVAS */

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-3;
}

/* GRID */

.grid{
    position:fixed;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-2;
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    0%{
        transform:translateY(0);
    }
    100%{
        transform:translateY(40px);
    }
}

/* GLOW ORBS */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.4;
    animation:float 8s infinite ease-in-out;
}

.orb1{
    width:300px;
    height:300px;
    background:#00ffee;
    top:-50px;
    left:-100px;
}

.orb2{
    width:250px;
    height:250px;
    background:#ff00ff;
    bottom:-50px;
    right:-80px;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(40px);
    }
}

/* MAIN CONTAINER */

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    z-index:10;
}

/* GLASS CARD */

.card{
    width:90%;
    max-width:900px;
    padding:50px;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:30px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    box-shadow:
    0 0 30px rgba(0,255,255,0.2),
    inset 0 0 20px rgba(255,255,255,0.05);

    text-align:center;
    animation:fadeIn 2s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0px);
    }
}

/* TITLE */

h1{
    font-size:6rem;
    color:#00ffee;
    text-shadow:
    0 0 10px #00ffee,
    0 0 20px #00ffee,
    0 0 40px #00ffee;

    animation:flicker 3s infinite alternate;
}

@keyframes flicker{
    0%{
        opacity:1;
    }
    100%{
        opacity:0.85;
    }
}

/* TYPING */

.typing{
    margin-top:20px;
    font-size:1.3rem;
    color:#ffffff;
    border-right:2px solid #00ffee;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:
    typing 6s steps(40,end) infinite,
    blink 0.7s infinite;
}

@keyframes typing{
    0%{
        width:0;
    }

    50%{
        width:100%;
    }

    100%{
        width:0;
    }
}

@keyframes blink{
    50%{
        border-color:transparent;
    }
}

/* STATS */

.stats{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.stat{
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:20px;
    min-width:150px;
    border:1px solid rgba(0,255,255,0.2);
    transition:0.3s;
}

.stat:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 0 20px cyan;
}

.stat h2{
    color:#00ffee;
    margin-bottom:10px;
}

/* BUTTONS */

.buttons{
    margin-top:40px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    padding:15px 35px;
    border-radius:50px;
    border:1px solid #00ffee;
    text-decoration:none;
    color:#00ffee;
    transition:0.4s;
    position:relative;
    overflow:hidden;
}

.btn::before{
    content:'';
    position:absolute;
    width:0%;
    height:100%;
    top:0;
    left:0;
    background:#00ffee;
    z-index:-1;
    transition:0.4s;
}

.btn:hover::before{
    width:100%;
}

.btn:hover{
    color:black;
    box-shadow:0 0 25px #00ffee;
}

/* SCANLINE */

.scanline{
    position:fixed;
    width:100%;
    height:5px;
    background:rgba(0,255,255,0.08);
    animation:scan 5s linear infinite;
    z-index:999;
}

@keyframes scan{
    0%{
        top:-10%;
    }
    100%{
        top:110%;
    }
}

/* RESPONSIVE */

@media(max-width:768px){

    h1{
        font-size:3rem;
    }

    .typing{
        font-size:1rem;
    }

    .card{
        padding:30px;
    }
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="grid"></div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="scanline"></div>

<div class="container">

    <div class="card">

        <h1>ZENTRIX</h1>

        <div class="typing">
            Cybersecurity • CTF • Red Team • Open Source • Linux
        </div>

        <div class="stats">

            <div class="stat">
                <h2>CTF</h2>
                <p>Player</p>
            </div>

            <div class="stat">
                <h2>Linux</h2>
                <p>Power User</p>
            </div>

            <div class="stat">
                <h2>Cyber</h2>
                <p>Researcher</p>
            </div>

        </div>

        <div class="buttons">

            <a class="btn" href="https://github.com/Zentrix006">
                GitHub
            </a>

            <a class="btn" href="#">
                Projects
            </a>

            <a class="btn" href="#">
                Contact
            </a>

        </div>

    </div>

</div>

<script>

/* MATRIX EFFECT */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "アァイィウヴエカキクケコサシスABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const array = letters.split("");

const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){
    drops[x] = 1;
}

function draw(){

    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ffee";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++){

        const text = array[Math.floor(Math.random()*array.length)];

        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(draw,35);

/* RESIZE */

window.addEventListener('resize',()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

</script>

</body>
</html>
